name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'openatta/XForge'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci
        working-directory: xforge

      - name: Verify tagged release and privacy boundary
        run: node scripts/release-check.mjs --require-tag

      - name: Publish exact package version
        env:
          NPM_DIST_TAG: ${{ inputs.channel }}
        run: npm publish --access public --tag "$NPM_DIST_TAG" --provenance
        working-directory: xforge
