# What this scenario selects on top of what `xforge init` produced.
#
# Only the additions. The Scaffold version, the CLI pin and the target list are init's to decide, and
# a seed that shipped a whole Manifest would freeze all three into a fixture with no business knowing
# them — silently, because the file stays valid as they move.
#
# `solid-contract` ships as a template under xforge/scaffold/flows/; naming it here is what makes the
# harness adopt it, by the same copy its own header documents.
#
# What this scenario is *for* changed in 0.8.4. The contract layer that needs no configuration --
# a validated delta, a write-protected baseline, a decision ledger, a merge at archive -- is now in
# the shipped `solid` and `major` Flows, so a project gets it without selecting anything, and
# `test/integration/contract-default-layer.test.ts` is what holds that behaviour. What is still
# opt-in, and what this scenario therefore exercises, is the tier above it: the four
# `builtin: declared` Gates and the Flow that schedules them. `interfaces-are-contract-governed` is
# no longer named below because `xforge init` now selects it.
project:
  layout: monorepo
  modules:
    - id: store
      path: src/store
      kind: library
    - id: api
      path: src/api
      kind: service
scaffold:
  flows: [solid-contract]
  gates: [contract-lint, contract-compat, contract-drift, module-boundaries]
flow: solid-contract
