code: XF-REPAIR-001
title: 补不回来
meaning: 受管文件缺了，但载荷里没有可用的副本：要么载荷里没有这份文件，要么载荷里那份的校验和与完整性清单对不上。对不上说明载荷不是这份清单说的那一版（多半是脚手架还停在旧版本），拿它覆盖就是把一份错的正文写进去。
remedy:
  command: xforge update
  text: 用新版载荷对齐骨架，再 repair。
variants:
  - seen: 脚手架停在旧版本，载荷里是新版正文
    note: 校验和对不上，所以一个字都不写 —— 对齐版本是 update 的事。
  - seen: 清单里记着一份载荷从来没有过的文件
    note: 清单被人改过或写坏过；xforge doctor 会一直报它，直到清单被改回来。
