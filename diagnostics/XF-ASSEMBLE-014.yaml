code: XF-ASSEMBLE-014
title: "执法钩子跑不起来"
meaning: "钩子装进了宿主原生位置，但它未必会跑。两种情形：一是宿主那边还要人再放行一次（codex 的 `/hooks` 信任，改过之后要重新放行）；二是钩子命令在跑 doctor 的这个进程的 PATH 上解析不到 —— 钩子由宿主进程去起、用的是宿主的 PATH，两边不一样是常态。都是提醒不是判决，但在放行之前 enforcement 会照实报 unavailable。"
remedy:
  text: "先确认宿主那边找不找得到它；确实找不到就把 CLI 装到宿主进程也看得见的 PATH 上（npm i -g @xforge/cli），或把钩子声明里的命令改成绝对路径。"
variants: []
