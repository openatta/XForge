apiVersion: xforge.dev/v1alpha1
kind: Project
metadata:
  name: minimal-example
project:
  layout: single
  modules:
    - id: root
      path: .
      kind: application
scaffold:
  version: 0.1.0
  source:
    type: git
    repository: https://github.com/openatta/XForge.git
    commit: 99b8726f67ad337e257a52fc606d296927097730
  skills: [xforge-explore]
  agents: []
  rules: []
  hooks: []
  gates: [structure, unit-tests]
scripts: []
xforge:
  source: npm
  package: "@xforge/cli"
  version: 0.1.0
  protocol: "1"
flow: quick
targets: [codex, claude]
install:
  conflictPolicy: fail
  prune: managed-only
  commitGeneratedFiles: true
