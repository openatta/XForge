apiVersion: xforge.dev/v1alpha1
kind: Project
metadata:
  name: minimal-example
project:
  layout: single
  modules:
    - id: root
      path: .
      kind: application
scaffold:
  language: en
  version: 0.3.0
  source:
    type: npm
    package: "@xforge/cli"
    version: 0.3.0
  skills: [xforge-explore]
  agents: []
  rules: []
  hooks: []
  gates: [structure, unit-tests]
scripts: []
xforge:
  source: npm
  package: "@xforge/cli"
  version: 0.3.0
  protocol: "1"
flow: quick
targets: [codex, claude]
install:
  conflictPolicy: fail
  prune: managed-only
  commitGeneratedFiles: true
