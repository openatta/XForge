apiVersion: xforge.dev/v1alpha2
kind: PermissionPolicy
metadata:
  name: protected-files
  version: 1
spec:
  capability: fs.write
  effect: deny
  match:
    paths:
      - xforge/constitution.md
      - xforge/specs/**
      - xforge/manifest.yaml
      - xforge/lock.yaml
      - xforge/flows/**
      - xforge/.audit/**
  exceptActors: [integrator]
  reason: >-
    Shared governance files may be written only by the Integrator, an explicit
    XForge transaction, or the CLI itself. xforge/scaffold/** is intentionally
    not denied — the xforge-scaffold Skill legitimately edits it.
