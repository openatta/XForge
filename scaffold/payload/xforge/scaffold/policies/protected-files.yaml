apiVersion: xforge.dev/v1alpha2
kind: PermissionPolicy
metadata:
  name: protected-files
  version: 1
spec:
  capability: fs.write
  effect: deny
  match:
    paths:
      - xforge/constitution.md
      - xforge/specs/**
      - xforge/manifest.yaml
      - xforge/lock.yaml
  exceptActors: [integrator]
  reason: Shared governance files may be written only by the Integrator or an explicit XForge transaction.
