# Selected by default since 0.8.4, and enforced by two mechanisms that need no configuration: the
# `protected-files` policy refuses a write to the baseline at the tool call, and the `contract-delta`
# validator refuses a malformed delta in-process, at the moment anything reads it. `xforge state`
# reports that pair as `guarded, structural`.
#
# `gateRefs` ships empty, and the comment on it says why: naming a Gate the project has not enabled
# is refused outright, and every contract Gate is `builtin: declared`, so enabling them by default
# would block every project on a command it never asked to write. Selecting them is how a project
# upgrades `structural` to `verified`.
#
# What the default layer governs, precisely: a *declared* interface change. What it does not:
# an undeclared one. A Change that moves an interface while classifying itself `moduleContract:
# false` owes no delta and nothing here notices -- `contract-compat` is the Gate that compares the
# declaration with what actually moved, and it is the first one to select when that matters.
apiVersion: xforge.dev/v1alpha2
kind: Rule
metadata:
  name: interfaces-are-contract-governed
  version: 1
spec:
  severity: must
  instruction: >-
    Interfaces between modules — HTTP operations, event schemas, database table structure, and the
    symbols one module exports to another — are defined by the baseline under xforge/contracts/, and
    a Change that alters one declares the alteration in its own contract-delta before implementing
    it. Reference the contract from the implementation rather than restating it, so there is one
    place a reader can be wrong about. Never edit the baseline directly: it is the record of what was
    agreed, archive merges the delta into it, and a Worker who edits it in place leaves every other
    package building against something nothing agreed to. When the implementation and the contract
    disagree, change the implementation — changing the contract is a decision that needs a named
    person in evidence/conditions/contractDecisions.yaml. The protected-files policy is a guardrail
    an honest Agent respects rather than a boundary that stops a determined one; the binding check is
    contract-compat, which compares what the delta declared against what actually moved.
  scope:
    # Matched against a Change's declared change.yaml scope.paths, not against the repository — and
    # handed to the host as a native file matcher as well, so it has to read sensibly as both. Source
    # roots rather than xforge/contracts/**: the Change this Rule needs to reach is the one editing
    # an implementation, which is where an interface moves without anyone saying so.
    paths:
      - src/**
      - migrations/**
  enforcement:
    # Empty, and not because there is no Gate for this. `contract-compat`, `contract-drift` and
    # `module-boundaries` are exactly the Gates that would go here -- and `resource-loader.ts`
    # refuses a Rule naming a Gate the project has not enabled (XFORGE_RULE_GATE_DISABLED, an
    # error), which is the correct order stated as a refusal: a project selects the Gate first and
    # names it here second. Since all three are `builtin: declared`, shipping them enabled would
    # block every project at a Stage exit until it declared a command for a check it never asked
    # for, so they ship unselected and this list ships empty.
    #
    # A project that wants the stronger property does both, in this order:
    #   1. add contract-compat (and contract-drift, module-boundaries) to `scaffold.gates` in
    #      xforge/manifest.yaml, add each to the Stage that should run it, and
    #      `xforge verification declare` its command
    #   2. add them to `gateRefs` here
    # `xforge state` then reports this Rule as `verified` rather than `structural`.
    gateRefs: []
    # The half of this Rule that holds with nothing selected, and the reason it is not decorative
    # without the Gates. `contract-delta` is an Artifact validator the CLI runs in-process: a delta
    # whose element ids do not parse, or whose sections are blank rather than `(none)`, is refused
    # when it is read, with no Gate and no Evidence -- which is why this reports as `structural`
    # rather than `verified`. A Flow that declares no Artifact carrying this validator resolves the
    # ref to nothing, exactly as an absent Gate does.
    validatorRefs:
      - contract-delta
    policyRefs:
      # protected-files, not a policy of this Rule's own. The deny list is derived from
      # core/ownership-zones.ts, which is where xforge/contracts/** is claimed; a second policy
      # naming the same path would be a second copy to edit and the first one to go stale.
      - protected-files
    # approvalRefs is empty on purpose. A contract decision rides the contractDecisions ledger plus
    # whichever planning approval the Flow already collects, and naming one of those policies would
    # report `unenforceable` under every Flow that does not declare it.
