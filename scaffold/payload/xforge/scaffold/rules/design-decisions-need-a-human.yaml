apiVersion: xforge.dev/v1alpha2
kind: Rule
metadata:
  name: design-decisions-need-a-human
  version: 3
spec:
  severity: must
  # "Before implementation begins" rather than "before the Check Stage is entered".
  #
  # Both Flows that have a pre-implementation approval now collect it at the *check* exit: solid's
  # `planning-solid` and major's `implementation-major` are taken at the same point in their
  # respective Stage lists, unlocking the same transition into Apply. So "before implementation
  # begins" names one moment under both, and the wording no longer has to paper over an asymmetry.
  # It is still the accurate phrasing rather than "before the Check Stage is entered", because Check
  # is now entered without any human decision — the decision is what lets the Change leave it.
  #
  # quick has no pre-implementation approval at all, and under quick this Rule is instruction only;
  # `xforge state` says so (coverage: unenforceable) instead of reporting enforcement that cannot
  # fire.
  instruction: >-
    A Change may not enter implementation on an Agent's own reading of the Design. A human records
    the planning decision before implementation begins.
  scope:
    stages:
      - design
      - check
  enforcement:
    # approved: satisfied by a current-revision human approval receipt from whichever of these
    # policies the active Flow defines. Listing both is what makes the Rule enforceable in solid and
    # major alike; a ref naming no policy in the running Flow is ignored rather than counted.
    gateRefs: []
    policyRefs: []
    approvalRefs:
      - planning-solid
      - implementation-major
