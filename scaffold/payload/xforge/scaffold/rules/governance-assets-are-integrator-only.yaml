apiVersion: xforge.dev/v1alpha2
kind: Rule
metadata:
  name: governance-assets-are-integrator-only
  version: 1
spec:
  severity: must
  instruction: >-
    Shared governance assets (Constitution, canonical Specs, Manifest, Lock, Flow definitions,
    Audit chain) are written by the Integrator, an explicit XForge transaction, or the CLI itself,
    never by a Worker implementing a work package. Change content under xforge/changes/ is written
    by the governing Skills and is intentionally outside this Rule's scope.
  scope:
    paths:
      - xforge/constitution.md
      - xforge/specs/**
      - xforge/manifest.yaml
      - xforge/lock.yaml
      - xforge/flows/**
      - xforge/.audit/**
  enforcement:
    # guarded: a live PermissionPolicy refuses the write at the tool call.
    gateRefs: []
    policyRefs:
      - protected-files
