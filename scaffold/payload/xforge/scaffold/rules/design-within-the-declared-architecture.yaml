apiVersion: xforge.dev/v1alpha2
kind: Rule
metadata:
  name: design-within-the-declared-architecture
  version: 1
spec:
  severity: should
  instruction: >-
    When xforge/architecture.md exists, read it before designing or implementing, and state in the
    Stage's Artifact how this Change stands against each decision it touches: within it, deliberately
    departing from it (say why), or proposing to change it. A departure that is written down is a
    fact somebody can act on; the same departure recorded in a build-file comment is one nobody will
    find. Proposing a change is a legitimate third answer, not a failure — an architecture that can
    only be complied with is one every Change will quietly route around. When the file does not
    exist, proceed normally and say so once: it is a project that has not written its architecture
    down, not a project in violation. Judgement guidance only; XForge does not claim to enforce it.
  scope:
    paths:
      - src/**
  enforcement:
    # instructed only. Conformance is a judgement about a document, and a Gate that scored it would
    # be scoring prose — the same mistake as accepting an Agent's PASS as Gate Evidence. What is
    # mechanically checkable about the architecture is checkable elsewhere: an invariant belongs in
    # a declared-verification command.
    #
    # An architecture decision leaves a record -- `evidence/conditions/architectureDeltas.yaml`,
    # written only by `xforge-architect` and naming a decider -- but a record is not a check. No
    # shipped Flow declares that ledger as an exit condition, so nothing evaluates it and nothing
    # blocks on it. It said "caught by its ledger" here until an audit asked which code did the
    # catching and found none. An unauthorised architecture change is, today, not caught by
    # anything; what the ledger buys is that an authorised one is attributable afterwards.
    # Empty, and the route out of empty is two steps rather than one.
    #
    # `module-boundaries` is the one architecture invariant this product can execute: it compares
    # the directions `project.modules[].dependsOn` declares with the imports the code actually
    # takes. Naming it here is what would let this Rule report `verified` instead of `instructed`
    # forever -- but a Rule may not reference a Gate the project has not enabled
    # (XFORGE_RULE_GATE_DISABLED), and `module-boundaries` is `required: true` with
    # `builtin: declared`, so shipping it enabled would block every project at Verify until it
    # declared a command for a check it never asked for.
    #
    # So a project that wants this enforced does both, in this order:
    #   1. add `module-boundaries` to `scaffold.gates` in xforge/manifest.yaml, add the Gate to the
    #      Stage that should run it, and `xforge verification declare` its command
    #   2. add `module-boundaries` to `gateRefs` here
    #
    # Doing 2 without 1 is refused, which is the correct order stated as an error.
    gateRefs: []
    policyRefs: []
