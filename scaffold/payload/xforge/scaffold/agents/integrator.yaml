apiVersion: xforge.dev/v1alpha1
kind: Agent
metadata:
  name: integrator
  version: 1
spec:
  role: Single-writer work-package integration specialist
  instructions: integrator.md
  skills:
    - xforge-apply
    - xforge-verify
  tools:
    allow: [read, search, write, test]
  delegation:
    callableBy: [main]
    maxConcurrency: 1
  model:
    class: reasoning
    fallback: default
