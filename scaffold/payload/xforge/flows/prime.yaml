apiVersion: xforge.dev/v1alpha1
kind: Flow
metadata:
  name: prime
  version: 1
  description: High-risk and cross-system governed change flow
artifacts:
  - id: proposal
    generates: proposal.md
    description: Explain the governed change
    instruction: State scope, critical impacts, Flow choice, rollback, and owners.
    outline: |
      ## Why
      ## Scope
      ## Flow choice
      ## Impact
      ## Rollback
      ## Owners
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Define observable requirements and scenarios
    instruction: Include success, failure, security, privacy, and compatibility scenarios.
    outline: |
      ## ADDED Requirements
      ### Requirement: <name>
      #### Scenario: <name>
      - **WHEN** ...
      - **THEN** ...
    requires: [proposal]
  - id: design
    generates: design.md
    description: Explain the architecture and alternatives
    instruction: Evaluate Constitution constraints, trust boundaries, and compatibility.
    outline: |
      ## Context
      ## Decisions
      ## Alternatives
      ## Trust boundaries
      ## Risks
    requires: [proposal, specs]
  - id: risk-assessment
    generates: risk-assessment.md
    description: Assess engineering and enterprise risk
    instruction: Score likelihood/impact and name mitigations, owners, and residual risk.
    outline: |
      ## Risk matrix
      ## Mitigations
      ## Residual risk
    requires: [design]
  - id: test-plan
    generates: test-plan.md
    description: Define the verification strategy
    instruction: Map every critical requirement and risk to deterministic evidence.
    outline: |
      ## Coverage matrix
      ## Environments
      ## Evidence
    requires: [design, risk-assessment]
  - id: rollout-plan
    generates: rollout-plan.md
    description: Define rollout and rollback
    instruction: State sequencing, monitoring, stop signals, owners, and rollback.
    outline: |
      ## Rollout
      ## Monitoring
      ## Stop signals
      ## Rollback
    requires: [design, risk-assessment]
  - id: tasks
    generates: tasks.md
    description: Track governed implementation work
    instruction: Make tasks dependency-aware and map them to tests and rollout controls.
    outline: |
      ## Tasks
      - [ ] 1. Implement controls
      - [ ] 2. Verify and collect evidence
      - [ ] 3. Prepare rollout
    requires: [design, test-plan, rollout-plan]
  - id: approval
    generates: approvals/release.md
    description: Record external release approval
    instruction: Prepare the request; only an authorized human or system may mark approval granted.
    outline: |
      ## Approval request
      - Status: pending
      - Approver:
      - Decision timestamp:
      - Evidence reviewed:
    requires: [tasks, test-plan, rollout-plan]
operations:
  apply:
    requires: [approval]
    tracks: tasks.md
  archive:
    requires: [specs, tasks, approval]
    syncSpecs: true
    mandatoryGates: [structure, unit-tests, security-scan]
