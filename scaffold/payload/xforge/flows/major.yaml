apiVersion: xforge.dev/v1alpha2
kind: Flow
metadata:
  name: major
  version: 6
  description: High-assurance governance for high-risk, cross-system, or critical-impact changes
policy:
  assuranceLevel: major
  eligibleWhen:
    risk: [low, medium, high]
    criticalImpacts: allowed
    # No Stage here produces a contract delta, so a Change that says it moves a module interface has
    # nowhere to declare what it moved and nothing that would merge it. `solid-contract` is the Flow
    # that carries one; this refuses the claim rather than accepting it and governing nothing.
    contractImpact: forbidden
  requiredWhen:
    risk: [high]
    anyImpact: [security, privacy, publicApi, dataMigration]
artifacts:
  - id: proposal
    generates: proposal.md
    description: Explain the governed change reason, boundaries, and success criteria
    instruction: Describe Why, Scope, Non-goals, Actors and success criteria, critical impacts, Flow choice, and rollback boundary. The `##` headings are the outline below, exactly -- this sentence names the subjects, not the section set.
    outline: |
      ## Why
      ## Scope
      ## Non-goals
      ## Actors and success criteria
      ## Flow choice
      ## Critical impacts and rollback
  - id: delta-specs
    generates: specs/**/*.md
    description: Define observable requirement and scenario deltas
    instruction: Use stable Requirement IDs for success, failure, boundary, security, privacy, and compatibility scenarios without implementation detail.
    outline: |
      ## ADDED Requirements
      ### Requirement: <REQ-ID> <name>
      #### Scenario: <name>
      - **WHEN** ...
      - **THEN** ...
  - id: clarifications
    generates: clarifications.md
    description: Record material questions and decisions affecting scope, risk, compatibility, or acceptance
    instruction: Narrate the question, impact, decision, and source, then atomically update Proposal and delta Specs. Stage exit is decided by the material-questions ledger, not by this prose.
    outline: |
      ## Material questions
      ## Decisions
      ## Sources
      ## Resolved updates
  - id: material-questions
    generates: evidence/conditions/materialQuestions.yaml
    description: Machine-decidable record of every material question and who decided it
    instruction: One entry per material question with question, impact, decision, decidedBy (a named person), and decidedAt (ISO 8601). The Stage cannot exit while any entry is undecided; prose in clarifications.md does not satisfy it.
    outline: |
      condition: materialQuestions
      entries:
        - id: <q-id>
          question: <what was unclear>
          impact: <scope|risk|compatibility|acceptance>
          decision: <what was decided>
          decidedBy: <person>
          decidedAt: <ISO 8601>
  - id: design
    generates: design.md
    description: Record the high-assurance technical design, risk controls, and delivery boundaries
    instruction: Cover architecture decisions, alternatives, trust boundaries, failure modes, compatibility, mitigations, tests, rollout, monitoring, stop signals, owners, parallel boundaries, and rollback.
    outline: |
      ## Context and constraints
      ## Decisions and alternatives
      ## Trust boundaries
      ## Risks and mitigations
      ## Test strategy
      ## Rollout, monitoring and stop signals
      ## Owners and parallel boundaries
      ## Migration and rollback
    markers:
      - id: verification-coverage
        section: Test strategy
        role: requirement-coverage
      - id: rejected-alternative
        section: Decisions and alternatives
        role: decision-alternative
        pattern: ['**Rejected alternative:', '**被否决的替代方案：']
      - id: deferred-question
        section: Risks and mitigations
        role: declared-gap
        pattern: ['**Deferred to Check:', '**留待 Check 决议：']
  - id: check-report
    generates: check-report.md
    description: Narrate the pre-implementation semantic review across Artifacts
    instruction: Explain completeness, consistency, testability, risk, and feasibility, and record under Gates and evidence what `xforge check` actually reported. Use Rework to name the Stage a blocker sends this Change back to and what must change there, and say plainly when there is nothing to rework. Do not write a verdict on whether Check passes — the findings ledger decides that, and a verdict in prose only competes with the record that governs.
    outline: |
      ## Completeness
      ## Consistency
      ## Testability
      ## Feasibility and risk
      ## Gates and evidence
      ## Rework
  - id: check-findings
    generates: evidence/check-findings.yaml
    description: Machine-decidable findings ledger the Check Gate can actually decide
    instruction: One entry per finding with id, severity (blocker|warning|suggestion), summary, refs to the Artifacts it concerns, and for a blocker a status, a reworkTo Stage while open, and a resolvedBy identity once resolved. Record an explicit empty list when the review found nothing. The Stage cannot exit while any blocker is unresolved.
    outline: |
      findings:
        - id: <finding-id>
          severity: <blocker|warning|suggestion>
          summary: <what is wrong>
          refs: [<Requirement id | artifact or spec path>]
          status: <open|resolved>
          reworkTo: <stage id, required while a blocker is open>
          resolvedBy: <name or email, required once status is resolved for a blocker; must match a known approver or Git author>
  - id: constitution-check
    generates: evidence/constitution-check.yaml
    description: Answer every Constitution principle for this Change
    instruction: One entry per `## ` principle in xforge/constitution.md, each with status compliant|violation|not-applicable. Every entry must cite at least one machine-locatable reference in `references` — a Requirement id from this Change's delta Specs, a file path that exists, or `gate:<name>` for a Gate that passed. A violation additionally needs a justification and a named approvedBy; not-applicable needs a justification. A general claim of compliance does not satisfy the Gate, and neither does an approval receipt on its own — a receipt records that someone approved a transition, not why this Change satisfies the principle.
    outline: |
      principles:
        - principle: <exact `## ` heading from constitution.md>
          status: <compliant|violation|not-applicable>
          references: [<Requirement id | existing path | gate:<name>>]
          justification: <required for violation and not-applicable>
          approvedBy: <named person, required for violation>
  - id: assurance
    generates: assurance.md
    description: Record verification against requirements, design, risks, and constraints
    instruction: Summarize completeness, correctness, coherence, risk, and Gates with traceable evidence.
    outline: |
      ## Completeness
      ## Correctness
      ## Coherence
      ## Risk controls
      ## Gates and evidence
      ## Findings
    markers:
      - id: verification-coverage
        section: Completeness
        role: requirement-coverage
governance:
  # `local` sits alongside `enterprise-approvals` (unlike a hypothetical enterprise-only policy) so
  # a fresh project isn't locked out of Major entirely until an external approval system is
  # registered. `enterprise-approvals` ships as a placeholder that fails loudly rather than
  # pretending to work, so until somebody points it at a real system every Major decision is in
  # practice captured through `local` — and refusing that would mean refusing Major.
  #
  # `minApprovers: 1` is deliberate, and it is not a relaxation. `separationOfDuties: true` is what
  # carries the weight here: it requires that the one approver is *not* an implementer of this
  # Change, where implementers are the Git authors of the Change directory and of every work-package
  # delivery range (`core/revision.ts`'s `changeImplementers`). A second signature adds a second
  # person; it does not add a second kind of scrutiny, and asking for two on every Major bought
  # queueing rather than review. Note what `separationOfDuties` is not: it has never compared roles.
  # `roles` is an eligibility filter — who may approve at all — and counting distinct roles was the
  # bug this rule replaced, because it let a Change's own author approve it while rejecting the
  # commonest real review shape, two different maintainers.
  #
  # Nor does this leave the review itself to one signature. Major separately declares the
  # `independentReview` exit condition on Verify, which requires an attributed review of the
  # delivered work before the Stage can be left. That condition covers "was this reviewed, and by
  # whom"; these policies cover "who authorised it to proceed". Raising `minApprovers` back to 2
  # would duplicate the first question, not strengthen the second.
  approvalPolicies:
    - id: implementation-major
      minApprovers: 1
      roles: [owner, maintainer, security]
      separationOfDuties: true
      providers: [local, enterprise-approvals]
    - id: closing-major
      minApprovers: 1
      roles: [owner, maintainer, security]
      separationOfDuties: true
      providers: [local, enterprise-approvals]
  # `remoteDelivery: optional` is the shipped default on purpose. Setting it to `required` blocks
  # archive with `audit:remote-pending` until every workflow event has been accepted by an HTTP
  # receiver, and `XFORGE_AUDIT_ENDPOINT` is unset on a fresh install, so a default project would
  # drive a Major Change through propose → verify, collect two human approvals, and then never be
  # able to close it — `xforge audit retry` cannot clear a queue that has nowhere to go. Remote
  # delivery is an enterprise opt-in: point `manifest.yaml`'s `audit.remote.endpointEnv` at a real
  # sink, then set this (and `terminal.archive.auditPolicy.remoteDelivery`) to `required`, or add
  # `major` to the manifest's `audit.remote.requiredFor`.
  audit:
    requiredEventTypes: [gate.after, stage.entered, approval.decided]
    runtimeCoverage: optional
    remoteDelivery: optional
stages:
  - id: propose
    skill: xforge-propose
    authority: planning-write
    requires: []
    produces: [proposal, delta-specs]
    gates: [structure]

  - id: clarify
    skill: xforge-clarify
    authority: planning-write
    requires: [propose]
    produces: [clarifications, material-questions]
    revises: [proposal, delta-specs]
    reworkTo: [propose]
    exit:
      conditions:
        materialQuestions: resolved
  - id: design
    skill: xforge-design
    authority: planning-write
    requires: [clarify]
    produces: [design]
    reworkTo: [propose, clarify]
  - id: check
    skill: xforge-check
    authority: assurance-write
    requires: [design]
    produces: [check-report, check-findings, constitution-check]
    gates: [structure, check-findings, constitution-check]
    reworkTo: [propose, clarify, design]
    exit:
      approvals: [implementation-major]
  # `check` belongs in `reworkTo` for the same reason Solid has it there. Without it, Check is the
  # one Stage a Major Change can never return to: `legalTransitionTargets` offers the next Stage
  # plus `reworkTo` and nothing else, so neither Apply nor Verify (whose only rework target is
  # Apply) could reach it, and a Constitution violation found during implementation had to be
  # answered by editing the Design — the one Artifact that did not need to change — to walk forward
  # through Check again. Allowing it gives up nothing: `implementation-major` is bound to the Check
  # exit, so returning there invalidates it and the approval must be given again, which is the same
  # bargain every other rework target already makes.
  - id: apply
    skill: xforge-apply
    authority: implementation-write
    requires: [check]
    produces: []
    reworkTo: [propose, clarify, design, check]
  - id: verify
    skill: xforge-verify
    authority: assurance-write
    requires: [apply]
    produces: [assurance]
    gates: [structure, unit-tests, security-scan]
    reworkTo: [apply]
    exit:
      conditions:
        verificationReceipt: passed
        # Major declares three semantic reviews and ships a reviewer sub-Agent, but nothing ever
        # required one: `succeeded` alone satisfied the control plane, so a high-risk Change could
        # be designed, implemented, reviewed and signed off by a single executor. This makes the
        # Reviewer acknowledgement a condition of leaving Verify. It enforces that a review
        # happened and is attributed; whether the reviewer is genuinely independent is reported in
        # State rather than asserted here, because one session can name any actor it likes.
        independentReview: complete
terminal:
  archive:
    handler: xforge-verify
    authority: archive-write
    requires: [verify]
    syncSpecs: true
    approvals: [closing-major]
    auditPolicy:
      requiredEventTypes: [gate.after, stage.entered, approval.decided]
      runtimeCoverage: optional
      remoteDelivery: optional
