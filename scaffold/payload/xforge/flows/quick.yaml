apiVersion: xforge.dev/v1alpha2
kind: Flow
metadata:
  name: quick
  version: 3
  description: Fast delivery for low-risk, single-module, clearly scoped, and easily reversible changes
policy:
  assuranceLevel: quick
  eligibleWhen:
    risk: [low]
    criticalImpacts: forbidden
    maxModules: 1
artifacts:
  - id: proposal
    generates: proposal.md
    description: Explain the reason, boundaries, and Flow choice
    instruction: Describe Why, Scope, Non-goals, Success criteria, impact, rollback, and the factual basis for choosing Quick.
    outline: |
      ## Why
      ## Scope
      ## Non-goals
      ## Success criteria
      ## Flow choice
      ## Impact and rollback
  - id: delta-specs
    generates: specs/**/*.md
    description: Define observable requirement and scenario deltas
    instruction: Use stable Requirement IDs for success, failure, boundary, and compatibility scenarios without implementation detail.
    outline: |
      ## ADDED Requirements
      ### Requirement: <REQ-ID> <name>
      #### Scenario: <name>
      - **WHEN** ...
      - **THEN** ...
  - id: constitution-check
    generates: evidence/constitution-check.yaml
    description: Answer every Constitution principle for this Change
    instruction: One entry per `## ` principle in xforge/constitution.md, each with status compliant|violation|not-applicable. Every entry must cite at least one machine-locatable reference in `references` — a Requirement id from this Change's delta Specs, a file path that exists, or `gate:<name>` for a Gate that passed. A violation additionally needs a justification and a named approvedBy; not-applicable needs a justification. A general claim of compliance does not satisfy the Gate.
    outline: |
      principles:
        - principle: <exact `## ` heading from constitution.md>
          status: <compliant|violation|not-applicable>
          references: [<Requirement id | existing path | gate:<name>>]
          justification: <required for violation and not-applicable>
          approvedBy: <named person, required for violation>
  - id: assurance
    generates: assurance.md
    description: Record verification against requirements, tests, and constraints
    instruction: Summarize completeness, correctness, coherence, and Gates with traceable evidence.
    outline: |
      ## Completeness
      ## Correctness
      ## Coherence
      ## Gates and evidence
      ## Findings
governance:
  approvalPolicies:
    - id: quick-close
      minApprovers: 1
      roles: [owner, maintainer]
      separationOfDuties: false
      providers: [local, enterprise-approvals]
  # Kept identical to `terminal.archive.auditPolicy` below. `xforge audit verify` reads this block
  # while archive resolves `terminal.archive.auditPolicy ?? governance.audit`; when the two disagree
  # the command reports a Change as audit-complete that archive then rejects. Quick's archive needs
  # a `quick-close` approval, so `approval.decided` belongs in both.
  audit:
    requiredEventTypes: [gate.after, stage.entered, approval.decided]
    runtimeCoverage: optional
    remoteDelivery: optional
stages:
  - id: propose
    skill: xforge-propose
    authority: planning-write
    requires: []
    produces: [proposal, delta-specs]
    gates: [structure]

  - id: apply
    skill: xforge-apply
    authority: implementation-write
    requires: [propose]
    produces: []
    reworkTo: [propose]
  # Quick has no Check Stage, so the Constitution ledger is answered here rather than before
  # implementation. That is a deliberate trade-off: enforcing it at Propose would ask an Agent to
  # certify compliance against a Change that has not been designed or written yet — exactly the
  # unfalsifiable "seven labelled sentences" the ledger exists to replace. Answering it at Verify
  # means every entry can cite something real (a Requirement, the diff, `gate:unit-tests`), and the
  # gate ordering below runs `unit-tests` first so `constitution-check` can cross-check it.
  - id: verify
    skill: xforge-verify
    authority: assurance-write
    requires: [apply]
    produces: [constitution-check, assurance]
    gates: [structure, unit-tests, constitution-check]
    reworkTo: [apply]
    exit:
      conditions:
        verificationReceipt: passed
terminal:
  archive:
    handler: xforge-verify
    authority: archive-write
    requires: [verify]
    syncSpecs: true
    approvals: [quick-close]
    auditPolicy:
      requiredEventTypes: [gate.after, stage.entered, approval.decided]
      runtimeCoverage: optional
      remoteDelivery: optional
