apiVersion: xforge.dev/v1alpha2
kind: Project
metadata:
  name: xforge-project
project:
  layout: single
  paths:
    specs: xforge/specs
    changes: xforge/changes
  modules:
    - id: root
      path: .
      kind: application
scaffold:
  version: 0.7.0
  language: en
  source:
    type: npm
    package: "@xforge/cli"
    version: 0.7.0
  skills:
    - xforge-explore
    - xforge-propose
    - xforge-clarify
    - xforge-design
    - xforge-check
    - xforge-apply
    - xforge-verify
    - xforge-status
    - xforge-continue
    - xforge-revise
    - xforge-scaffold
    - xforge-archive
    - xforge-kanban
  agents:
    - worker
    - integrator
    - reviewer
  rules: []
  policies:
    - protected-files
  hooks:
    - runtime-audit
  gates:
    - structure
    - unit-tests
    - security-scan
scripts:
  - project-context
xforge:
  source: npm
  package: "@xforge/cli"
  version: 0.7.0
  protocol: "2"
flow: solid
targets:
  - codex
  - claude
  - cursor
  - opencode
  - github-copilot
install:
  conflictPolicy: fail
  prune: managed-only
  commitGeneratedFiles: true
approvals:
  providers:
    - id: enterprise-hmac
      type: hmac-sha256
      secretEnv: XFORGE_APPROVAL_HMAC_SECRET
      roles: [owner, maintainer, security]
audit:
  redaction: strict
  localRetentionDays: 30
  remote:
    endpointEnv: XFORGE_AUDIT_ENDPOINT
    tokenEnv: XFORGE_AUDIT_TOKEN
    hmacSecretEnv: XFORGE_AUDIT_HMAC_SECRET
    timeoutSeconds: 5
    requiredFor: [major]
