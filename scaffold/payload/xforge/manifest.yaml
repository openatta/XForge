apiVersion: xforge.dev/v1alpha2
kind: Project
metadata:
  name: xforge-project
project:
  layout: single
  paths:
    specs: xforge/specs
    changes: xforge/changes
  modules:
    - id: root
      path: .
      kind: application
scaffold:
  version: 0.7.8
  language: en
  source:
    type: npm
    package: "@xforge/cli"
    version: 0.7.8
  skills:
    - xforge-explore
    - xforge-propose
    - xforge-clarify
    - xforge-design
    - xforge-check
    - xforge-apply
    - xforge-verify
    - xforge-status
    - xforge-continue
    - xforge-revise
    - xforge-scaffold
    - xforge-archive
    - xforge-kanban
  agents:
    - worker
    - integrator
    - reviewer
  rules:
    - governance-assets-are-integrator-only
    - observable-requirements-are-tested
    - design-decisions-need-a-human
    - prefer-small-explicit-contracts
  policies:
    - protected-files
  hooks:
    - runtime-audit
  gates:
    - structure
    - check-findings
    - constitution-check
    - unit-tests
    - security-scan
  mcpServers:
    - enterprise-approvals
scripts:
  - project-context
xforge:
  source: npm
  package: "@xforge/cli"
  version: 0.7.8
  protocol: "2"
flow: solid
targets:
  - codex
  - claude
  - cursor
  - opencode
  - github-copilot
install:
  conflictPolicy: fail
  prune: managed-only
  commitGeneratedFiles: true
# XForge supports exactly two approval mechanisms: the CLI's own interactive terminal (always
# available, not listed here) and an mcp provider reached over the Model Context Protocol. There is
# no signed-file-import path. `enterprise-approvals` is the provider Major's policies require; its
# matching McpServer resource (scaffold/mcp-servers/enterprise-approvals.yaml) is a placeholder — it
# ships with a command that does not exist, on purpose. Replace it with the approval system your
# organization actually runs before Major can produce a real decision; until then,
# `xforge approve --provider enterprise-approvals` fails loudly with XFORGE_APPROVAL_MCP_CONNECTION_FAILED
# instead of silently pretending to work.
approvals:
  providers:
    - id: enterprise-approvals
      type: mcp
      mcpServer: enterprise-approvals
      roles: [owner, maintainer, security]
audit:
  redaction: strict
  localRetentionDays: 30
  remote:
    endpointEnv: XFORGE_AUDIT_ENDPOINT
    tokenEnv: XFORGE_AUDIT_TOKEN
    hmacSecretEnv: XFORGE_AUDIT_HMAC_SECRET
    timeoutSeconds: 5
    requiredFor: [major]
